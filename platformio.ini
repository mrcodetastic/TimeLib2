; Host-side unit tests for the dependency-free conversion layer.
;
; The ESP32 examples are compiled separately by CI using:
;   pio ci examples/TimeNTP_ESP32 --board esp32dev --lib .
;
; Native tests require a host C++ compiler (GCC/Clang).

[platformio]
src_dir = .
test_dir = test
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -I.
build_src_filter =
    +<TimeConversions.cpp>
    +<DateStrings.cpp>
